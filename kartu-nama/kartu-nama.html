<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartu Nama PT Madafa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1F3A2B; --green2:#2E5A3F; --cream:#F6F1E4; --gold:#B8924A; --ink:#23302A; --muted:#5E6B62;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E4E1D8;font-family:Montserrat,sans-serif;color:var(--ink);padding:10mm}
  h2.group{font:600 13px Montserrat;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:8mm 0 3mm}
  .row{display:flex;gap:8mm;flex-wrap:wrap}
  .sheet{--b:0mm;width:calc(90mm + 2*var(--b));height:calc(55mm + 2*var(--b));background:var(--cream);position:relative;overflow:hidden;
        box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
  .card{position:absolute;left:var(--b);top:var(--b);width:90mm;height:55mm}
  /* elemen latar diperpanjang ke area bleed */
  .bx{position:absolute}
  .label{font:500 10px Montserrat;color:var(--muted);margin-top:2mm}

  /* ---------- FRONT ---------- */
  .front .leaf{position:absolute;opacity:.13}
  .front .top{position:absolute;inset:1mm 0 15mm 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .logo{width:19mm;height:19mm;margin-bottom:.8mm;display:flex;align-items:center;justify-content:center}
  .logo img{max-width:100%;max-height:100%}
  .logo.ph{border-radius:50%;border:.3mm dashed var(--gold);font:600 6px Montserrat;color:var(--gold);letter-spacing:.1em}
  .front .co{font:700 13.2pt/1 'Cormorant Garamond',serif;color:var(--green);letter-spacing:.06em}
  .front .cn{font:700 8.2pt/1 'Noto Serif SC',serif;color:var(--green2);letter-spacing:.12em;margin-top:1.4mm}
  .rule{display:flex;align-items:center;gap:1.5mm;margin:1.6mm 0 1.3mm}
  .rule i{display:block;width:9mm;height:.25mm;background:var(--gold)}
  .rule b{display:block;width:1.3mm;height:1.3mm;background:var(--gold);transform:rotate(45deg)}
  .front .tag{font:500 5.6pt Montserrat;color:var(--muted);letter-spacing:.05em}
  .band{position:absolute;left:0;right:0;bottom:0;height:15mm;z-index:1;background:var(--green);display:flex;justify-content:space-around;align-items:center;padding:0 6mm}
  .bandbg{left:calc(-1*var(--b));right:calc(-1*var(--b));bottom:calc(-1*var(--b));height:calc(15mm + var(--b));background:var(--green);border-top:.5mm solid var(--gold)}
  .prod{display:flex;flex-direction:column;align-items:center;gap:1mm;color:var(--cream)}
  .prod svg{width:6.2mm;height:6.2mm}
  .prod span{font:600 5pt Montserrat;letter-spacing:.1em;text-transform:uppercase}

  /* ---------- BACK ---------- */
  .sidebg{left:calc(-1*var(--b));top:calc(-1*var(--b));bottom:calc(-1*var(--b));width:calc(2.2mm + var(--b));background:var(--green);border-right:.5mm solid var(--gold)}
  .back .info{position:absolute;left:8mm;top:6.5mm;right:30mm}
  .name{font:700 13pt/1.05 'Cormorant Garamond',serif;color:var(--green);white-space:nowrap}
  .title{font:600 5.6pt Montserrat;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-top:1.2mm}
  .cnline{font:500 7pt 'Noto Serif SC',serif;color:var(--green2);margin-top:1.1mm;letter-spacing:.08em}
  .back .hr{height:.25mm;background:var(--gold);width:14mm;margin:2.4mm 0 2.2mm}
  .contact{list-style:none;display:flex;flex-direction:column;gap:1.25mm}
  .contact li{display:flex;align-items:center;gap:1.8mm;font:500 5.9pt Montserrat;color:var(--ink);white-space:nowrap}
  .contact svg{width:2.9mm;height:2.9mm;flex:none;fill:var(--green)}
  .qrbox{position:absolute;right:6mm;top:9mm;width:22mm;text-align:center}
  .qr{width:22mm;height:22mm;background:#fff;padding:1.4mm;border:.25mm solid #D9CFB6}
  .qr img{width:100%;height:100%;display:block}
  .qr.ph{display:flex;align-items:center;justify-content:center;border:.3mm dashed var(--gold);font:600 4.8pt/1.4 Montserrat;color:var(--gold)}
  .qrcap{font:600 5pt Montserrat;color:var(--green);margin-top:1.4mm;letter-spacing:.04em}
  .qrcap.zh{font:700 6.2pt 'Noto Serif SC',serif;letter-spacing:.1em}
  .mini{position:absolute;right:6mm;bottom:4mm;font:700 5pt 'Cormorant Garamond',serif;color:var(--green);letter-spacing:.14em;opacity:.75}

  /* mode cetak: ?cetak=<orang>-<versi> → 2 halaman 96×61 mm (bleed 3 mm) */
  body.cetak{background:none;padding:0}
  body.cetak .sheet{--b:3mm;box-shadow:none;break-after:page}
  @page{size:96mm 61mm;margin:0}
</style>
</head>
<body>

<!-- Ikon bersama -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-cardamom" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M12 3c4 3 5 9 0 18C7 12 8 6 12 3z"/><path d="M12 5v14M9.6 8c1 1.4 3.8 1.4 4.8 0M9.3 12c1.2 1.6 4.2 1.6 5.4 0M10 16c.9 1.2 3.1 1.2 4 0"/><path d="M12 3V1.5"/></g></symbol>
    <symbol id="i-mangosteen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="14" r="7.5"/><path d="M12 6.5c-1.6-1.8-4-1.6-4.6.4 1.4.6 3.2.4 4.6-.4zM12 6.5c1.6-1.8 4-1.6 4.6.4-1.4.6-3.2.4-4.6-.4z"/><path d="M12 6.5V3.2"/></g></symbol>
    <symbol id="i-dracaena" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M12 22V13"/><path d="M12 13C11 8 8 5 4 3c1 4 3.5 8 8 10z"/><path d="M12 13c1-5 4-8 8-10-1 4-3.5 8-8 10z"/><path d="M12 13c-.6-4 0-8 0-11 .6 3 .9 7 0 11z"/><path d="M9 22h6"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.2-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.6-.1 1.2z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M3 5h18c.6 0 1 .4 1 1v12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V6c0-.6.4-1 1-1zm9 7.2L4 7.2V8l8 5 8-5v-.8z"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15 15 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 0 1 0-4h3.4a16 16 0 0 0 0 4zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.3 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14 14 0 0 1 0-4h4.6a14 14 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zm1.7-5.6a16 16 0 0 0 0-4h3.4a8 8 0 0 1 0 4z"/></symbol>
    <symbol id="i-wechat" viewBox="0 0 24 24"><path d="M9 3C4.6 3 1 6 1 9.6c0 2 1.1 3.9 2.9 5.1L3.2 17l2.6-1.3c.9.3 2 .5 3.2.5h.6a5.6 5.6 0 0 1-.2-1.6c0-3.6 3.4-6.5 7.6-6.5h.6C16.9 5.2 13.3 3 9 3zM6.3 8.6a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm5.4 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM23 14.6c0-3-3-5.4-6.6-5.4s-6.6 2.4-6.6 5.4S12.8 20 16.4 20c.8 0 1.6-.1 2.3-.4l2.2 1.1-.6-1.9c1.6-1.1 2.7-2.6 2.7-4.2zm-8.8-.8a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm4.4 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8z"/></symbol>
    <symbol id="leafdeco" viewBox="0 0 100 100"><g fill="#1F3A2B"><path d="M50 98C46 70 30 40 2 20c34 4 52 34 48 78z"/><path d="M52 96c4-30 20-56 46-70-24 2-46 30-46 70z"/></g></symbol>
  </defs>
</svg>

<template id="front">
  <div class="sheet"><div class="card front">
    <div class="bx bandbg"></div>
    <svg class="leaf" style="width:34mm;height:34mm;right:-9mm;top:-8mm;transform:rotate(200deg)"><use href="#leafdeco"/></svg>
    <svg class="leaf" style="width:26mm;height:26mm;left:-8mm;top:-6mm;transform:rotate(150deg)"><use href="#leafdeco"/></svg>
    <div class="top">
      <div class="logo ph">LOGO</div>
      <div class="co">PT MADAFA ALAM SEJAHTERA</div>
      <div class="cn" data-zh>印尼玛达法天然农产品有限公司</div>
      <div class="rule"><i></i><b></b><i></i></div>
      <div class="tag">Exporter of Fruits, Ornamental Plants &amp; Spices</div>
    </div>
    <div class="band">
      <div class="prod"><svg><use href="#i-cardamom"/></svg><span>White Cardamom</span></div>
      <div class="prod"><svg><use href="#i-mangosteen"/></svg><span>Mangosteen</span></div>
      <div class="prod"><svg><use href="#i-dracaena"/></svg><span>Dracaena</span></div>
    </div>
  </div></div>
</template>

<div id="out"></div>

<script>
const people = [
  {key:'fauzan', name:'dr. Fauzan Muhammad Yusuf', title:'President Director', phone:'+62 813-1508-7272',
   email:'fauzan@madafaalamsejahtera.com', zh:'法赞 · 总裁', wechat:'fauzanmas', label:'Bapak (dr. Fauzan)'},
  {key:'resya', name:'Resya Nuralpiah', title:'Director of Business Development', phone:'+62 812-9108-3378',
   email:'resya@madafaalamsejahtera.com', zh:'蕾莎 · 业务发展总监', wechat:'Resyanura', label:'Resya'}
];
const WA = '+62 851-1051-1540', WEB = 'madafaalamsejahtera.com', WAQR = 'assets/qr-whatsapp-perusahaan.svg';
const LOGO = 'assets/logo-madafa.png';               // taruh file logo di sini
const wechatQR = k => `assets/qr-wechat-${k}.png`;   // qr-wechat-fauzan.png / qr-wechat-resya.png

// Pakai file bila ada, kalau tidak tampilkan placeholder
function tryImg(el, src){
  const im = new Image();
  im.onload = () => { el.classList.remove('ph'); el.textContent=''; const i=document.createElement('img'); i.src=src; el.append(i); };
  im.src = src;
  return new Promise(r => { im.addEventListener('load', r); im.addEventListener('error', r); });
}
const waits = [];

function front(zh){
  const n = document.getElementById('front').content.cloneNode(true);
  if(!zh) n.querySelector('[data-zh]').remove();
  waits.push(tryImg(n.querySelector('.logo'), LOGO));
  return n;
}
function back(p, zh){
  const s = document.createElement('div'); s.className='sheet';
  const d = document.createElement('div'); d.className='card back'; s.append(d);
  const qr = zh
    ? `<div class="qr ph" data-qr>QR WeChat<br>${p.label}<br>(menunggu file)</div>`
    : `<div class="qr"><img src="${WAQR}"></div>`;
  d.innerHTML = `
    <div class="bx sidebg"></div>
    <div class="info">
      <div class="name">${p.name}</div>
      <div class="title">${p.title}</div>
      ${zh ? `<div class="cnline">${p.zh}</div>` : ''}
      <div class="hr"></div>
      <ul class="contact">
        <li><svg><use href="#i-phone"/></svg>${p.phone}</li>
        <li><svg><use href="#i-wa"/></svg>WhatsApp ${WA}</li>
        ${zh ? `<li><svg><use href="#i-wechat"/></svg>WeChat: ${p.wechat}</li>` : ''}
        <li><svg><use href="#i-mail"/></svg>${p.email}</li>
        <li><svg><use href="#i-web"/></svg>${WEB}</li>
      </ul>
    </div>
    <div class="qrbox">${qr}<div class="qrcap ${zh?'zh':''}">${zh ? '扫码加微信' : 'Scan to WhatsApp'}</div></div>
    <div class="mini">MADAFA</div>`;
  if (zh) waits.push(tryImg(d.querySelector('[data-qr]'), wechatQR(p.key)));
  return s;
}
// Perkecil nama sampai muat satu baris
function fitNames(){
  document.querySelectorAll('.name').forEach(n => {
    let pt = 13;
    while (n.scrollWidth > n.parentElement.clientWidth && pt > 8) { pt -= .25; n.style.fontSize = pt + 'pt'; }
  });
}

const out = document.getElementById('out');
const cetak = new URLSearchParams(location.search).get('cetak'); // mis. fauzan-intl, resya-china
if (cetak) {
  document.body.classList.add('cetak');
  const [k, v] = cetak.split('-'); const p = people.find(x => x.key === k), zh = v === 'china';
  const f = document.createElement('div'); f.append(front(zh));
  out.append(f.firstElementChild, back(p, zh));
} else {
  for (const zh of [false, true]) for (const p of people) {
    const h = document.createElement('h2'); h.className='group';
    h.textContent = `${p.label} · Versi ${zh ? 'China' : 'Internasional'}`;
    const row = document.createElement('div'); row.className='row';
    const a = document.createElement('div'); a.append(front(zh)); a.insertAdjacentHTML('beforeend','<div class="label">Sisi depan</div>');
    const b = document.createElement('div'); b.append(back(p, zh)); b.insertAdjacentHTML('beforeend','<div class="label">Sisi belakang</div>');
    row.append(a,b); out.append(h,row);
  }
}
window.siap = document.fonts.ready.then(() => Promise.all(waits)).then(() => { fitNames(); return true; });
</script>
</body>
</html>
