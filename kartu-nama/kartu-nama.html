<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kartu Nama PT Madafa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --green:#1F4A2C; --green2:#3E6B3A; --sage:#7E9A63; --cream:#F4EEDD; --gold:#A8843F; --ink:#24302A; --muted:#55604F; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E4E1D8;font-family:Montserrat,sans-serif;color:var(--ink);padding:10mm}
  h2.group{font:600 13px Montserrat;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:8mm 0 3mm}
  .row{display:flex;gap:8mm;flex-wrap:wrap}
  .label{font:500 10px Montserrat;color:var(--muted);margin-top:2mm}

  /* --b = bleed. Pratinjau 0, cetak 3 mm */
  .sheet{--b:0mm;width:calc(90mm + 2*var(--b));height:calc(55mm + 2*var(--b));position:relative;overflow:hidden;
         background:radial-gradient(ellipse at 40% 35%,#FBF7EC 0%,var(--cream) 60%,#EDE5CF 100%);
         box-shadow:0 2px 8px rgba(0,0,0,.18);flex:none}
  .card{position:absolute;left:var(--b);top:var(--b);width:90mm;height:55mm}
  .art{position:absolute;left:-3mm;top:-3mm;width:96mm;height:61mm}
  .abs{position:absolute}

  /* ---------- DEPAN ---------- */
  .f-logo{left:4.5mm;top:6mm;width:25mm;height:25mm;display:flex;align-items:center;justify-content:center}
  .f-logo img,.b-logo img{max-width:100%;max-height:100%}
  .ph{border-radius:50%;border:.3mm dashed var(--gold);font:600 6px Montserrat;color:var(--gold)}
  .f-text{left:31mm;right:4mm;top:4mm;height:31mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .brand{font:700 25pt/0.9 'Cormorant Garamond',serif;color:var(--green);letter-spacing:.04em}
  .brand small{font-size:.48em;letter-spacing:.06em;margin-right:.18em;vertical-align:.32em}
  .sub{display:flex;align-items:center;gap:1.6mm;margin-top:1.4mm;font:600 6.3pt Montserrat;color:var(--green2);letter-spacing:.24em}
  .sub i{display:block;width:6mm;height:.25mm;background:var(--gold)}
  .cnname{font:700 7.3pt 'Noto Serif SC',serif;color:var(--green);letter-spacing:.1em;margin-top:1.3mm}
  .tagline{display:flex;align-items:center;gap:1.2mm;margin-top:1.4mm;font:italic 600 7.4pt 'Cormorant Garamond',serif;color:var(--ink);white-space:nowrap}
  .tagline svg{width:3.6mm;height:2.2mm;flex:none;color:var(--sage)}
  .icons{left:0;right:0;top:40.2mm;display:flex;justify-content:space-evenly;padding:0 8mm}
  .ic{display:flex;flex-direction:column;align-items:center;gap:.9mm;width:22mm}
  .ic .c{width:7.4mm;height:7.4mm;border-radius:50%;border:.3mm solid #E9DFC3;display:flex;align-items:center;justify-content:center;color:#F4EEDD}
  .ic .c svg{width:4.6mm;height:4.6mm}
  .ic span{font:600 4.7pt Montserrat;color:#F4EEDD;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}

  /* ---------- BELAKANG ---------- */
  .b-left{left:0;top:3.2mm;width:39mm;display:flex;flex-direction:column;align-items:center;text-align:center}
  .b-logo{width:16mm;height:16mm;display:flex;align-items:center;justify-content:center}
  .b-left .brand{font-size:15pt;margin-top:.6mm}
  .b-left .sub{font-size:4.5pt;gap:1.1mm;margin-top:1mm;letter-spacing:.2em}
  .b-left .sub i{width:3.5mm}
  .b-left .tagline{font-size:5.6pt;margin-top:1mm;gap:.8mm}
  .b-left .tagline svg{width:2.6mm;height:1.6mm}
  .divider{left:40.2mm;top:6mm;bottom:6mm;width:.25mm;background:linear-gradient(var(--gold),var(--green2) 50%,var(--gold))}
  .b-right{left:43.5mm;right:3mm;top:4.8mm}
  .name{font:700 12pt/1.05 'Cormorant Garamond',serif;color:var(--green);white-space:nowrap}
  .title{font:600 5.6pt Montserrat;color:var(--ink);letter-spacing:.03em;margin-top:.6mm;white-space:nowrap}
  .cnline{font:500 6.3pt 'Noto Serif SC',serif;color:var(--green2);margin-top:.6mm;letter-spacing:.08em}
  .contact{list-style:none;margin-top:1.8mm;display:flex;flex-direction:column;gap:.75mm}
  .contact li{display:flex;align-items:center;gap:1.5mm;font:500 5.4pt Montserrat;color:var(--ink);white-space:nowrap}
  .contact .ci{width:3mm;height:3mm;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
  .contact .ci svg{width:1.8mm;height:1.8mm;fill:#F4EEDD}
  .qrrow{left:43.5mm;right:3mm;bottom:3.6mm;display:flex;align-items:center;gap:2.4mm}
  .qr{width:14.5mm;height:14.5mm;background:#fff;padding:.9mm;border:.25mm solid #CDBF9C;flex:none}
  .qr img{width:100%;height:100%;display:block}
  .qr.ph{border-radius:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:4pt}
  .qrtext{display:flex;flex-direction:column;gap:.9mm}
  .qrcap{font:600 5pt Montserrat;color:var(--green);letter-spacing:.03em}
  .qrcap.zh{font:700 6.2pt 'Noto Serif SC',serif;letter-spacing:.1em}
  .thanks{font:italic 600 7pt/1.15 'Cormorant Garamond',serif;color:var(--green2)}
  .thanks .zh{font:500 5.6pt 'Noto Serif SC',serif;font-style:normal;color:var(--muted);display:block;margin-top:.4mm}

  /* mode cetak: ?cetak=<orang>-<versi> → 2 halaman 96×61 mm (bleed 3 mm) */
  body.cetak{background:none;padding:0}
  body.cetak .sheet{--b:3mm;box-shadow:none;break-after:page}
  @page{size:96mm 61mm;margin:0}
</style>
</head>
<body>

<script>
const people = [
  {key:'fauzan', name:'dr. Fauzan Muhammad Yusuf', title:'President Director', phone:'+62 813-1508-7272',
   email:'fauzan@madafaalamsejahtera.com', zh:'法赞 · 总裁', wechat:'fauzanmas', label:'Bapak (dr. Fauzan)'},
  {key:'resya', name:'Resya Nuralpiah', title:'Director of Business Development', phone:'+62 812-9108-3378',
   email:'resya@madafaalamsejahtera.com', zh:'蕾莎 · 业务发展总监', wechat:'Resyanura', label:'Resya'}
];
const WA = '+62 851-1051-1540', WEB = 'madafaalamsejahtera.com', WAQR = 'assets/qr-whatsapp-perusahaan.svg';
const LOGO = 'assets/logo-madafa.png';
const wechatQR = k => `assets/qr-wechat-${k}.png`;

const waits = [];
function tryImg(el, src, phText){
  el.classList.add('ph'); el.innerHTML = phText;
  const im = new Image();
  waits.push(new Promise(r => { im.onload = () => { el.classList.remove('ph'); el.innerHTML=''; const i=document.createElement('img'); i.src=src; el.append(i); r(); }; im.onerror = r; }));
  im.src = src;
}
const li = (icon, text) => `<li><span class="ci"><svg><use href="#${icon}"/></svg></span>${text}</li>`;

function front(zh){
  const n = document.getElementById('t-front').content.firstElementChild.cloneNode(true);
  if(!zh) n.querySelector('[data-zh]').remove();
  tryImg(n.querySelector('[data-logo]'), LOGO, 'LOGO');
  return n;
}
function back(p, zh){
  const n = document.getElementById('t-back').content.firstElementChild.cloneNode(true);
  const f = k => n.querySelector(`[data-f="${k}"]`);
  f('name').textContent = p.name; f('title').textContent = p.title;
  if (zh) f('zh').textContent = p.zh; else f('zh').remove();
  f('contact').innerHTML = li('i-phone', p.phone) + li('i-wa', 'WhatsApp ' + WA) +
    (zh ? li('i-wechat', 'WeChat: ' + p.wechat) : '') + li('i-mail', p.email) + li('i-web', WEB);
  if (zh) { f('cap').classList.add('zh'); f('cap').textContent = '扫码加微信';
            f('thanks').innerHTML = 'Thank you for your trust<span class="zh">感谢您的信任</span>'; }
  else    { f('cap').textContent = 'Scan to chat on WhatsApp'; f('thanks').textContent = 'Thank you for your trust'; }
  tryImg(n.querySelector('[data-logo]'), LOGO, 'LOGO');
  const qr = n.querySelector('[data-qr]');
  if (zh) tryImg(qr, wechatQR(p.key), 'QR WeChat<br>(menunggu)'); else qr.innerHTML = `<img src="${WAQR}">`;
  return n;
}
function fitNames(){
  document.querySelectorAll('.name,.title').forEach(n => {
    const max = n.parentElement.clientWidth; let pt = parseFloat(getComputedStyle(n).fontSize) * 0.75;
    while (n.scrollWidth > max && pt > 4) { pt -= .25; n.style.fontSize = pt + 'pt'; }
  });
  document.querySelectorAll('.f-text .tagline').forEach(n => {
    const max = n.parentElement.clientWidth; let pt = 7.4;
    while (n.scrollWidth > max && pt > 5) { pt -= .2; n.style.fontSize = pt + 'pt'; }
  });
}

const out = document.getElementById('out');
const cetak = new URLSearchParams(location.search).get('cetak');
if (cetak) {
  document.body.classList.add('cetak');
  const [k, v] = cetak.split('-'); const p = people.find(x => x.key === k), zh = v === 'china';
  out.append(front(zh), back(p, zh));
} else {
  for (const zh of [false, true]) for (const p of people) {
    const h = document.createElement('h2'); h.className='group';
    h.textContent = `${p.label} · Versi ${zh ? 'China' : 'Internasional'}`;
    const row = document.createElement('div'); row.className='row';
    const a = document.createElement('div'); a.append(front(zh)); a.insertAdjacentHTML('beforeend','<div class="label">Sisi depan</div>');
    const b = document.createElement('div'); b.append(back(p, zh)); b.insertAdjacentHTML('beforeend','<div class="label">Sisi belakang</div>');
    row.append(a,b); out.append(h,row);
  }
}
window.siap = document.fonts.ready.then(() => Promise.all(waits)).then(() => { fitNames(); return true; });
</script>
</body>
